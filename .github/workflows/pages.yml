# Publishes the static site to GitHub Pages (the mirror; DeWEB comes later).
# Action inputs read from each action.yml at the pinned commit on 2026-11-17.
name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "app/landing/**"
      - "app/holding/**"
      - "brand/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble site
        run: |
          # The landing page is the ad page at the root. "Open app" goes to
          # app/, which shows the holding page until the app ships.
          mkdir -p _site/media _site/app
          cp app/landing/index.html app/landing/landing.css app/landing/landing.js _site/
          cp app/landing/media/payproof-film.mp4 app/landing/media/poster.jpg _site/media/
          cp app/holding/index.html _site/app/
          for d in _site _site/app; do
            cp brand/favicon/favicon.svg brand/favicon/favicon-32.png brand/favicon/apple-touch-icon-180.png "$d/"
            cp brand/logo/payproof-lockup.svg brand/logo/payproof-lockup-on-dark.svg "$d/"
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
